# Builds the two distributable artifacts and (optionally) publishes them as a
# GitHub Release:
#
#   * Windows - self-contained x64 payload wrapped in an Inno Setup installer
#   * Android - signed APK (net8.0-android34.0 / API 34)
#
# Manual dispatch only: Actions -> Release -> Run workflow, then type the version.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0 (no leading v). Overrides $(WprVersion) from Src/Directory.Build.props."
        required: true
        type: string
      android_version_code:
        description: "Android versionCode (integer, must increase between releases). Blank = this run's number."
        required: false
        type: string
      publish_release:
        description: "Create a GitHub Release and attach the artifacts"
        type: boolean
        default: true
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # Fail fast on a malformed version before burning ~20 minutes of runner time.
  # -------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_code: ${{ steps.v.outputs.version_code }}
    steps:
      - id: v
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH (got '${{ inputs.version }}')"
            exit 1
          fi

          CODE="${{ inputs.android_version_code }}"
          [[ -z "$CODE" ]] && CODE="${{ github.run_number }}"
          if [[ ! "$CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::android_version_code must be an integer (got '$CODE')"
            exit 1
          fi

          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE"         >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (Android versionCode $CODE)" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # Windows: publish self-contained, then wrap in an Inno Setup installer.
  # -------------------------------------------------------------------------
  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # -p:SolutionDir is required from the CLI: Src/Backends/FNA.Platform's
      # Directory.Build.props shadows the Src/ one that defines it (nearest-wins,
      # no parent import), so FNA.Core can't resolve WPR.Framework.Xna without it.
      # Trailing forward slash - a trailing backslash would escape the quote.
      - name: Publish (self-contained win-x64)
        shell: pwsh
        run: >
          dotnet publish Src/Platforms/WPR.Platform.Windows/WPR.Platform.Windows.csproj
          -c Release
          -f net8.0-windows10.0.17763.0
          -r win-x64
          --self-contained true
          -o publish/desktop
          -p:SolutionDir=${{ github.workspace }}/Src/
          -p:Version=${{ needs.validate.outputs.version }}
          -maxcpucount:1
          -nodeReuse:false
          --nologo

      # The csproj's "Copy pre-made database" target is AfterTargets="Build" and
      # writes to $(OutputPath), so it never reaches the publish folder.
      #
      # Source path moved 2026-08-30: Src/Database -> Src/Core/WPR.Database/Data when the
      # database was centralised into its own project. The assertions below exist because a
      # stale path here is the difference between a working installer and one that ships with
      # no catalogue at all — the app would install and then fail on first run.
      - name: Stage pre-made database
        shell: pwsh
        run: |
          $src = "Src/Core/WPR.Database/Data"
          if (-not (Test-Path $src)) { throw "seed database source '$src' not found - has it moved again?" }

          New-Item -ItemType Directory -Force publish/desktop/Database | Out-Null
          Copy-Item "$src/*" publish/desktop/Database -Recurse -Force

          foreach ($f in @("applications.db", "achievements.db")) {
            if (-not (Test-Path "publish/desktop/Database/$f")) { throw "staged payload is missing $f" }
          }
          $catalogues = (Get-ChildItem publish/desktop/Database/Achievements -Directory -ErrorAction SilentlyContinue).Count
          if ($catalogues -lt 1) { throw "staged payload has no achievement catalogues" }
          Write-Host "Staged both databases and $catalogues achievement catalogues."

          if (-not (Test-Path publish/desktop/WPR.Platform.Windows.exe)) {
            throw "publish succeeded but WPR.Platform.Windows.exe is missing"
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ needs.validate.outputs.version }} `
            /DPayloadDir=${{ github.workspace }}\publish\desktop `
            /DOutputDir=${{ github.workspace }}\dist `
            Packaging\windows\WPR.iss
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/WPR-Setup-*.exe
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Android: signed APK. Runs on Linux - faster, and the Android SDK is
  # preinstalled. Switch runs-on to windows-latest if the Linux leg ever
  # diverges from the local build.
  # -------------------------------------------------------------------------
  android:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install .NET Android workload
        run: dotnet workload install android

      # net8.0-android* maps to API 34 only; the runner image's default platform
      # set moves over time, so pin what we need explicitly.
      - name: Ensure Android SDK platform 34
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0"

      # Optional real signing key. Without these secrets .NET Android falls back
      # to a debug keystore generated fresh on each runner, which means every
      # release is signed with a DIFFERENT key and users cannot upgrade in place
      # (Android rejects it as "App not installed"). See README for setup.
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_B64" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/wpr.keystore"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - signing with a throwaway debug key. This APK will NOT install over a previous release."
          fi

      - name: Build signed APK
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          VERSION_CODE: ${{ needs.validate.outputs.version_code }}
        run: |
          SIGNING_ARGS=()
          if [[ "${{ steps.keystore.outputs.present }}" == "true" ]]; then
            SIGNING_ARGS=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$RUNNER_TEMP/wpr.keystore"
              -p:AndroidSigningStorePass='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
              -p:AndroidSigningKeyAlias='${{ secrets.ANDROID_KEY_ALIAS }}'
              -p:AndroidSigningKeyPass='${{ secrets.ANDROID_KEY_PASSWORD }}'
            )
          fi

          # A plain Release *build* stops short of packaging, hence SignAndroidPackage.
          dotnet build Src/Platforms/WPR.Platform.Android/WPR.Platform.Android.csproj \
            -c Release \
            -f net8.0-android34.0 \
            -t:SignAndroidPackage \
            -p:SolutionDir="$GITHUB_WORKSPACE/Src/" \
            -p:IncludeAndroidTargets=true \
            -p:ApplicationDisplayVersion="$VERSION" \
            -p:ApplicationVersion="$VERSION_CODE" \
            -p:EmbedAssembliesIntoApk=true \
            -p:AndroidEnableAssemblyCompression=false \
            -maxcpucount:1 \
            -nodeReuse:false \
            --nologo \
            "${SIGNING_ARGS[@]}"

      - name: Collect APK
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p dist
          BIN=Src/Platforms/WPR.Platform.Android/bin/Release/net8.0-android34.0
          APK=$(ls "$BIN"/*-Signed.apk 2>/dev/null | head -1)
          if [[ -z "$APK" ]]; then
            echo "::error::no signed APK produced in $BIN"
            ls -la "$BIN" || true
            exit 1
          fi
          cp "$APK" "dist/WPR-$VERSION.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/WPR-*.apk
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Publish. Skipped when publish_release is false, so you can dry-run the
  # build and just grab the workflow artifacts.
  # -------------------------------------------------------------------------
  release:
    needs: [validate, windows, android]
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    steps:
      # Checkout FIRST, before download-artifact. actions/checkout cleans the workspace by
      # default, so running it after the download would delete dist/ and the release would
      # publish with no files attached.
      #
      # fetch-depth: 0 because the changelog below walks git history; the default shallow
      # single-commit fetch would produce an empty log.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Release notes are generated from the commits since the previous v* tag, grouped by
      # Conventional-Commit prefix. The repo does not use those prefixes consistently — plenty of
      # commits are plain sentences — so anything unrecognised lands under "Other changes" rather
      # than being dropped. Merge commits are skipped.
      #
      # First release (no previous tag) walks the whole history, which is why the range is chosen
      # rather than hardcoded to a tag that may not exist.
      - name: Generate release notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          PREV=$(git tag --list 'v*' --sort=-v:refname | head -1 || true)
          if [[ -n "$PREV" ]]; then
            RANGE="$PREV..HEAD"
            COMPARE="Changes since [$PREV](https://github.com/$GITHUB_REPOSITORY/releases/tag/$PREV)."
          else
            RANGE=""
            COMPARE="First tagged release — this summarises the history to date."
          fi

          # Subject lines only, oldest first, merges excluded.
          git log --no-merges --reverse --pretty=format:'%s' ${RANGE:+$RANGE} > raw.txt || true
          printf '\n' >> raw.txt

          # Two clean-ups the real history needs:
          #  * drop placeholder subjects ("." and friends) — there are a dozen of them;
          #  * cap length. One commit has an entire multi-paragraph body as its subject
          #    (no blank line after the summary), which would otherwise swallow the notes.
          awk 'NF' raw.txt \
            | grep -vE '^[[:space:]]*\.*[[:space:]]*$' \
            | awk 'length($0) > 3' \
            | cut -c1-140 \
            > commits.txt || true
          echo "changelog: $(wc -l < commits.txt) usable commits in range '${RANGE:-<all history>}'"

          CONV='^(feat|fix|perf|chore|build|ci|refactor|test|style|docs)(\([^)]*\))?!?:'

          emit() {          # emit <heading> <regex> [max]
            local heading="$1" pattern="$2" max="${3:-0}" body total
            body=$(grep -iE "$pattern" commits.txt | sed -E 's/^[a-zA-Z]+(\([^)]*\))?!?:[[:space:]]*//' || true)
            if [[ -z "$body" ]]; then return 0; fi   # not `&&` : under set -e a false test aborts the script
            total=$(printf '%s\n' "$body" | wc -l)
            if [[ "$max" -gt 0 && "$total" -gt "$max" ]]; then
              printf '### %s\n\n%s\n\n_…and %d more._\n\n' \
                "$heading" "$(printf '%s\n' "$body" | head -"$max" | sed 's/^/- /')" "$((total - max))" >> body.md
            else
              printf '### %s\n\n%s\n\n' "$heading" "$(printf '%s\n' "$body" | sed 's/^/- /')" >> body.md
            fi
          }

          : > body.md
          emit "Features"    '^feat(\([^)]*\))?!?:'
          emit "Fixes"       '^fix(\([^)]*\))?!?:'
          emit "Performance" '^perf(\([^)]*\))?!?:'
          emit "Chores"      '^(chore|build|ci|refactor|test|style|docs)(\([^)]*\))?!?:'
          # Unprefixed commits still matter — this repo only partly uses Conventional Commits —
          # but they are the noisiest, so they are capped. grep -E has no negative lookahead,
          # hence the inverted match rather than an emit() call.
          OTHER=$(grep -ivE "$CONV" commits.txt || true)
          if [[ -n "$OTHER" ]]; then
            OTHER_N=$(printf '%s\n' "$OTHER" | wc -l)
            if [[ "$OTHER_N" -gt 20 ]]; then
              printf '### Other changes\n\n%s\n\n_…and %d more._\n\n' \
                "$(printf '%s\n' "$OTHER" | head -20 | sed 's/^/- /')" "$((OTHER_N - 20))" >> body.md
            else
              printf '### Other changes\n\n%s\n\n' "$(printf '%s\n' "$OTHER" | sed 's/^/- /')" >> body.md
            fi
          fi

          [[ -s body.md ]] || printf '_No changes recorded._\n\n' > body.md

          # A hand-written summary for this version, if one exists. A generated commit list is
          # fine for a patch release but says little useful about a large one, so an optional
          # Docs/ReleaseNotes/<version>.md is prepended as "Highlights" when present.
          HIGHLIGHTS="Docs/ReleaseNotes/$VERSION.md"
          if [[ -f "$HIGHLIGHTS" ]]; then
            echo "changelog: prepending curated highlights from $HIGHLIGHTS"
          else
            echo "changelog: no $HIGHLIGHTS found - generated commit list only"
          fi

          {
            printf 'Prebuilt WPR %s.\n\n' "$VERSION"
            printf '| Download | Platform |\n| --- | --- |\n'
            printf '| `WPR-Setup-%s.exe` | Windows x64 — self-contained, no .NET install required |\n' "$VERSION"
            printf '| `WPR-%s.apk` | Android — API 21+, arm64-v8a / x86_64 |\n\n' "$VERSION"
            printf "## What's changed\n\n%s\n\n" "$COMPARE"
            if [[ -f "$HIGHLIGHTS" ]]; then
              printf '## Highlights\n\n'
              cat "$HIGHLIGHTS"
              printf '\n## All changes\n\n'
            fi
            cat body.md
            printf 'Built from commit %s.\n' "$GITHUB_SHA"
          } > notes.md

          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          ls -la dist
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WPR $VERSION" \
            --notes-file notes.md \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            dist/*
